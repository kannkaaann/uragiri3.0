name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          cd "$(dirname "$(find . -name gradlew | head -1)")"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uragiri_keys-jar-Ver3.0.0
          path: "**/build/libs/uragiri_keys-3.0.0.jar"
